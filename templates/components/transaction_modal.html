<dialog id="transaction-modal" class="modal">

    <div class="modal-header">

        <h2 id="transaction-modal-title">
            Add Transaction
        </h2>

        <button
            type="button"
            class="close-button"
            data-close-dialog
            aria-label="Close dialog"
        >
            &times;
        </button>

    </div>


    <form id="transaction-form">

        <div class="form-group">

            <label for="transaction-date">Date</label>

            <input
                type="date"
                id="transaction-date"
                name="date"
                required
            >

        </div>


        <div class="form-group">

            <label for="transaction-description">
                Description
            </label>

            <input
                type="text"
                id="transaction-description"
                name="description"
                required
            >

        </div>


        <div class="form-group">

            <label for="transaction-type">Type</label>

            <select
                id="transaction-type"
                name="type"
            >

                <option value="expense">Expense</option>
                <option value="income">Income</option>
                <option value="transfer">Transfer</option>

            </select>

        </div>


        <div class="form-group">

            <label for="transaction-amount">
                Amount (€)
            </label>

            <input
                type="number"
                id="transaction-amount"
                name="amount"
                min="0.01"
                step="0.01"
                required
            >

        </div>


        <div class="form-group" id="category-group">

            <label for="transaction-category">
                Category
            </label>

            <select
                id="transaction-category"
                name="category_id"
                required
            >
                <option value="">Select category</option>
            </select>

        </div>


        <div class="form-group" id="from-account-group">

            <label for="from-account">
                From Account
            </label>

            <select
                id="from-account"
                name="from_account_id"
            >
                <option value="">Select account</option>
            </select>

        </div>


        <div class="form-group" id="to-account-group">

            <label for="to-account">
                To Account
            </label>

            <select
                id="to-account"
                name="to_account_id"
            >
                <option value="">Select account</option>
            </select>

        </div>


        <p class="form-error" id="transaction-error" role="alert" hidden></p>


        <div class="modal-actions">

            <button
                type="button"
                class="secondary-button"
                data-close-dialog
            >
                Cancel
            </button>

            <button type="submit">
                Save Transaction
            </button>

        </div>

    </form>

</dialog>
